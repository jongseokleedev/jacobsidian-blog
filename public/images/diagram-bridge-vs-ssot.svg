<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arr2r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr2g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background panels -->
  <rect x="16" y="16" width="340" height="288" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="364" y="16" width="340" height="288" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Panel titles -->
  <text x="186" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">Bridge 구조 (현재)</text>
  <text x="534" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">단일 기반 구조 (목표)</text>

  <!-- ===== BRIDGE side ===== -->
  <!-- 디자이너 -->
  <rect x="36" y="64" width="100" height="40" rx="8" fill="white" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="86" y="88" text-anchor="middle" font-size="12" fill="#374151">디자이너</text>

  <!-- Figma -->
  <rect x="36" y="136" width="100" height="40" rx="8" fill="white" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="86" y="156" text-anchor="middle" font-size="12" fill="#374151">피그마</text>
  <text x="86" y="170" text-anchor="middle" font-size="10" fill="#9ca3af">(캔버스 기반)</text>

  <!-- Bridge box -->
  <rect x="156" y="136" width="80" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="196" y="156" text-anchor="middle" font-size="11" fill="#92400e">Bridge</text>
  <text x="196" y="170" text-anchor="middle" font-size="10" fill="#b45309">MCP·플러그인</text>

  <!-- 코드 -->
  <rect x="256" y="136" width="80" height="40" rx="8" fill="white" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="296" y="156" text-anchor="middle" font-size="12" fill="#374151">코드</text>
  <text x="296" y="170" text-anchor="middle" font-size="10" fill="#9ca3af">(개발자)</text>

  <!-- 개발자 -->
  <rect x="256" y="64" width="80" height="40" rx="8" fill="white" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="296" y="88" text-anchor="middle" font-size="12" fill="#374151">개발자</text>

  <!-- Arrows BRIDGE -->
  <line x1="86" y1="104" x2="86" y2="134" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="296" y1="104" x2="296" y2="134" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="136" y1="156" x2="154" y2="156" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr2r)"/>
  <line x1="236" y1="156" x2="254" y2="156" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr2r)"/>

  <!-- Bridge problem labels -->
  <text x="186" y="208" text-anchor="middle" font-size="11" fill="#d97706">역해석 오류 발생</text>
  <text x="186" y="224" text-anchor="middle" font-size="11" fill="#d97706">변경 전파 불일치</text>
  <text x="186" y="240" text-anchor="middle" font-size="11" fill="#d97706">협의 마디 증가</text>

  <!-- ===== SSOT side ===== -->
  <!-- 디자이너 -->
  <rect x="384" y="64" width="100" height="40" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="434" y="88" text-anchor="middle" font-size="12" fill="#374151">디자이너</text>

  <!-- 개발자 -->
  <rect x="584" y="64" width="100" height="40" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="634" y="88" text-anchor="middle" font-size="12" fill="#374151">개발자</text>

  <!-- SSOT center -->
  <rect x="464" y="148" width="160" height="48" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="544" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">DESIGN.md</text>
  <text x="544" y="185" text-anchor="middle" font-size="10" fill="#047857">단일 진실 원본 (SSOT)</text>

  <!-- Arrows SSOT -->
  <line x1="434" y1="104" x2="514" y2="146" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr2g)"/>
  <line x1="634" y1="104" x2="574" y2="146" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr2g)"/>

  <!-- AI reads -->
  <rect x="494" y="224" width="100" height="36" rx="8" fill="white" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="544" y="244" text-anchor="middle" font-size="12" fill="#374151">AI + 코드</text>
  <line x1="544" y1="196" x2="544" y2="222" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr2g)"/>
  <text x="558" y="213" font-size="10" fill="#10b981">직접 참조</text>

  <!-- SSOT benefit labels -->
  <text x="534" y="278" text-anchor="middle" font-size="11" fill="#059669">변경 즉시 전파</text>
  <text x="534" y="294" text-anchor="middle" font-size="11" fill="#059669">협의 마디 제거</text>
</svg>
