<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arr3r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="280" rx="14" fill="#fff7f7" stroke="#fecaca" stroke-width="1.5"/>

  <text x="340" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">The Reverse-Parse Loop — Both sides doing work that isn't their job</text>

  <!-- Node 1: Code -->
  <rect x="40" y="60" width="130" height="50" rx="10" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-size="12" fill="#374151">Code</text>
  <text x="105" y="98" text-anchor="middle" font-size="10" fill="#6b7280">(working implementation)</text>

  <!-- Arrow: Code → HTML -->
  <line x1="170" y1="85" x2="226" y2="85" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3r)"/>
  <text x="198" y="76" text-anchor="middle" font-size="10" fill="#ef4444">engineer's work</text>

  <!-- Node 2: HTML mockup -->
  <rect x="226" y="60" width="130" height="50" rx="10" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="291" y="82" text-anchor="middle" font-size="12" fill="#374151">HTML mockup</text>
  <text x="291" y="98" text-anchor="middle" font-size="10" fill="#6b7280">(converted output)</text>

  <!-- Arrow: HTML → Figma -->
  <line x1="356" y1="85" x2="412" y2="85" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3r)"/>
  <text x="384" y="76" text-anchor="middle" font-size="10" fill="#ef4444">reverse-parsed</text>

  <!-- Node 3: Figma canvas -->
  <rect x="412" y="60" width="140" height="50" rx="10" fill="white" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="482" y="82" text-anchor="middle" font-size="12" fill="#374151">Figma canvas</text>
  <text x="482" y="98" text-anchor="middle" font-size="10" fill="#ef4444">⚠ imperfect reconstruction</text>

  <!-- Arrow: Figma → designer -->
  <path d="M552,85 Q620,85 620,160 Q620,200 552,200" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr3r)"/>
  <text x="638" y="148" text-anchor="middle" font-size="10" fill="#ef4444" transform="rotate(90,638,148)">designer's work</text>

  <!-- Node 4: Revised design -->
  <rect x="412" y="174" width="140" height="50" rx="10" fill="white" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="482" y="196" text-anchor="middle" font-size="12" fill="#374151">Revised design</text>
  <text x="482" y="212" text-anchor="middle" font-size="10" fill="#6b7280">(on a misaligned canvas)</text>

  <!-- Arrow: design → code -->
  <line x1="412" y1="199" x2="356" y2="199" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr3r)"/>

  <!-- Node 5: Code update -->
  <rect x="226" y="174" width="130" height="50" rx="10" fill="white" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="291" y="196" text-anchor="middle" font-size="12" fill="#374151">Code update</text>
  <text x="291" y="212" text-anchor="middle" font-size="10" fill="#ef4444">engineer reworks</text>

  <!-- Arrow back to start -->
  <path d="M226,199 Q105,199 105,112" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>

  <!-- Center label -->
  <text x="291" y="152" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">Both sides doing</text>
  <text x="291" y="167" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">work that isn't their job</text>
</svg>
