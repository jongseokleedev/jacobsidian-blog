<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">기능 버그 vs 보안 취약점 — 발견 시점의 차이</text>

  <!-- Timeline axis -->
  <line x1="60" y1="200" x2="630" y2="200" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="640" y="204" font-size="11" fill="#9ca3af">시간</text>

  <!-- Time markers -->
  <line x1="160" y1="195" x2="160" y2="205" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="160" y="218" text-anchor="middle" font-size="10" fill="#9ca3af">배포</text>

  <line x1="300" y1="195" x2="300" y2="205" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="#9ca3af">D+1</text>

  <line x1="480" y1="195" x2="480" y2="205" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="218" text-anchor="middle" font-size="10" fill="#9ca3af">사고 발생시</text>

  <!-- ROW 1: 기능 버그 -->
  <text x="60" y="80" font-size="11" font-weight="600" fill="#374151">기능 버그</text>

  <!-- Deploy point -->
  <circle cx="160" cy="72" r="5" fill="#d1d5db"/>

  <!-- Immediately discovered -->
  <rect x="168" y="56" width="140" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="238" y="75" text-anchor="middle" font-size="11" fill="#dc2626">즉시 유저 불만 발생</text>

  <!-- Arrow to fix -->
  <line x1="308" y1="72" x2="358" y2="72" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrT)"/>

  <rect x="360" y="56" width="100" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="410" y="75" text-anchor="middle" font-size="11" fill="#16a34a">빠른 수정</text>

  <!-- ROW 2: 보안 취약점 -->
  <text x="60" y="152" font-size="11" font-weight="600" fill="#374151">보안 취약점</text>

  <!-- Deploy point -->
  <circle cx="160" cy="144" r="5" fill="#d1d5db"/>

  <!-- Long silent period -->
  <rect x="168" y="128" width="300" height="32" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="318" y="147" text-anchor="middle" font-size="11" fill="#9ca3af">아무 문제도 없어 보임 (잠재 위협 누적)</text>

  <!-- Breach marker -->
  <line x1="480" y1="112" x2="480" y2="196" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="480" cy="144" r="6" fill="#ef4444"/>

  <rect x="490" y="128" width="120" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="550" y="143" text-anchor="middle" font-size="11" fill="#dc2626">사고 발생 후</text>
  <text x="550" y="157" text-anchor="middle" font-size="11" fill="#dc2626">뒤늦게 발견</text>

  <!-- Key insight -->
  <rect x="60" y="234" width="560" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="340" y="254" text-anchor="middle" font-size="11" fill="#92400e">'해킹을 당하지 않았다'는 '보안이 튼튼하다'와 다른 말입니다. 사고가 없는 건 대부분 공격할 가치가 없기 때문입니다.</text>
</svg>
