<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">보안 강도 ↔ 유저 불편도 트레이드오프</text>

  <!-- ── Top annotation boxes (width=110, centers at 160 / 340 / 520) ── -->

  <rect x="105" y="40" width="110" height="68" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="160" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">최소 기준 미달</text>
  <text x="160" y="76" text-anchor="middle" font-size="10" fill="#dc2626">없는 것보다 나쁨</text>
  <text x="160" y="92" text-anchor="middle" font-size="9" fill="#9ca3af">스티로폼 자물쇠</text>

  <rect x="285" y="40" width="110" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="340" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">서비스 적정 구간</text>
  <text x="340" y="76" text-anchor="middle" font-size="10" fill="#16a34a">유저 불편 최소화</text>
  <text x="340" y="92" text-anchor="middle" font-size="10" fill="#16a34a">+ 충분한 보안</text>

  <rect x="465" y="40" width="110" height="68" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="520" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#6b7280">과도한 보안</text>
  <text x="520" y="76" text-anchor="middle" font-size="10" fill="#6b7280">유저 불편 심각</text>
  <text x="520" y="92" text-anchor="middle" font-size="9" fill="#9ca3af">현실적 불가</text>

  <!-- ── Dashed lines from box bottoms to curve points ── -->
  <line x1="160" y1="108" x2="160" y2="298" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="340" y1="108" x2="340" y2="238" stroke="#86efac" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="520" y1="108" x2="520" y2="178" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ── Graph ── -->

  <!-- Y axis -->
  <line x1="80" y1="330" x2="80" y2="130" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="74" y="148" text-anchor="end" font-size="10" fill="#9ca3af">유저</text>
  <text x="74" y="160" text-anchor="end" font-size="10" fill="#9ca3af">불편도</text>

  <!-- X axis -->
  <line x1="80" y1="330" x2="620" y2="330" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="626" y="334" font-size="10" fill="#9ca3af">보안 강도</text>

  <!-- X axis labels -->
  <text x="160" y="348" text-anchor="middle" font-size="10" fill="#ef4444">10점</text>
  <text x="340" y="348" text-anchor="middle" font-size="10" fill="#f59e0b">70~80점</text>
  <text x="520" y="348" text-anchor="middle" font-size="10" fill="#6b7280">99점</text>

  <!-- Smooth single cubic bezier curve -->
  <path d="M80,330 C240,322 450,188 610,158" stroke="#3b82f6" stroke-width="2.5" fill="none"/>

  <!-- Curve points -->
  <circle cx="160" cy="302" r="6" fill="#ef4444" stroke="white" stroke-width="1.5"/>
  <circle cx="340" cy="242" r="6" fill="#10b981" stroke="white" stroke-width="1.5"/>
  <circle cx="520" cy="182" r="6" fill="#6b7280" stroke="white" stroke-width="1.5"/>

  <!-- JWT note -->
  <text x="340" y="368" text-anchor="middle" font-size="10" fill="#059669">JWT 등 타협안이 이 구간에 위치</text>

  <!-- Bottom insight -->
  <rect x="80" y="380" width="520" height="22" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="340" y="395" text-anchor="middle" font-size="10" fill="#92400e">보안 강화 = 유저 불편 증가 → 서비스에 맞는 적정 수준을 찾는 것이 개발자의 역할</text>
</svg>
